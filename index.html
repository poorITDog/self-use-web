<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5ead8" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Solara" />
  <link rel="manifest" href="solara.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23F4A261'/%3E%3Cstop offset='1' stop-color='%232A9D8F'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='128' height='128' rx='28' fill='url(%23g)'/%3E%3Ccircle cx='64' cy='54' r='22' fill='%23FFE8A3'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="solara.css" />
  <title>Solara — 日暖生活</title>
</head>
<body data-theme="sunshine">
  <div class="theme-scene" id="themeScene" aria-hidden="true"></div>
  <div class="app" id="app">
    <header class="app-bar" id="appBar" aria-live="polite"></header>
    <main>
      <section class="view active" data-view="habits" id="view-habits"></section>
      <section class="view" data-view="calendar" id="view-calendar"></section>
      <section class="view" data-view="countdown" id="view-countdown"></section>
      <section class="view" data-view="focus" id="view-focus"></section>
      <section class="view" data-view="settings" id="view-settings"></section>
    </main>
    <button type="button" class="fab global-fab" id="globalFab" data-action="quick-add" aria-label="快速新增">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <nav class="nav" id="nav" aria-label="主導覽">
    <button type="button" data-nav="habits" class="active" aria-label="習慣">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span class="nav-label">習慣</span>
    </button>
    <button type="button" data-nav="calendar" aria-label="日曆">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="nav-label">日曆</span>
    </button>
    <button type="button" data-nav="countdown" aria-label="倒數">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><polyline points="12 9 12 13 15 15"/><line x1="9" y1="2" x2="9.5" y2="4"/><line x1="15" y1="2" x2="14.5" y2="4"/></svg>
      <span class="nav-label">倒數</span>
    </button>
    <button type="button" data-nav="focus" aria-label="專注">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
      <span class="nav-label">專注</span>
    </button>
    <button type="button" data-nav="settings" aria-label="設定">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <span class="nav-label">設定</span>
    </button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="solara.js"></script>
</body>
</html>
